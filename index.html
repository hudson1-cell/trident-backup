<h1>Trident backup</h1>
<p>Trident backup is a private tool that makes a nightly, encrypted copy of one person's own Trident data and saves it to that same person's Google Drive.</p>
<p>It is not a public service. It has no users other than its owner, and it has no sign-up.</p>
